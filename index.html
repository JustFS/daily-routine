<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="./img/logo.png" />
  <title>Daily Routine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="page-shell">
    <main></main>

    <section class="control-panel" aria-label="Contrôles de routine">
      <div class="preset-grid">
        <button id="start" class="preset-card">
          <span class="btn-main">Start</span>
          <small class="btn-sub">15min</small>
        </button>
        <button id="startLong" class="preset-card">
          <span class="btn-main">Étirements longs</span>
          <small class="btn-sub">21m30</small>
        </button>
        <button id="versionLongue" class="preset-card">
          <span class="btn-main">Version longue</span>
          <small class="btn-sub">24min</small>
        </button>
      </div>

      <div class="secondary-controls">
        <button id="pause" class="ghost-btn">Pause</button>
        <button id="skip" class="ghost-btn">Skip</button>
      </div>
    </section>
  </div>

  <audio id="ring" src="ring.mp3"></audio>

  <div id="attendanceModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="closeAttendance" class="close">✕</button>
      <h3>Assiduité</h3>
      <div class="calendar-header">
        <button id="calPrev" class="cal-nav" aria-label="Mois précédent">‹</button>
        <div id="calendarMonth" class="calendar-month-label">Janvier 2026</div>
        <button id="calNext" class="cal-nav" aria-label="Mois suivant">›</button>
      </div>
      <div class="streak-info">
        <div>Actuelle: <span id="streakCurrent">0</span> jours</div>
        <div>Meilleure: <span id="streakBest">0</span> jours</div>
      </div>
      <div id="calendar" class="calendar-grid" aria-hidden="false"></div>
    </div>
  </div>

  <div id="toast" class="toast" aria-hidden="true" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
